server:
  port: ${PORT:8081}

spring:
  application:
    name: customer-service

  datasource:
    url: ${POSTGRES_DB:jdbc:postgresql://localhost:5432/customer_db}
    username: ${POSTGRES_USER:customer_service}
    password: ${POSTGRES_PASSWORD:customer_service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true